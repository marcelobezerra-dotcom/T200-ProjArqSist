spring.application.name=missao-marte-servidor

# Por padrao so aceita conexoes da propria maquina. Para o celular acessar: SERVER_ADDRESS=0.0.0.0 (veja DEPLOY.md).
# Provedores de nuvem informam a porta pela variavel PORT.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}

# Atras de um proxy que termina o HTTPS (nuvem), usa os cabecalhos X-Forwarded-* para montar as URLs.
server.forward-headers-strategy=framework
server.shutdown=graceful

# Banco H2 em arquivo (pasta ./dados). Troque a pasta com a variavel de ambiente MISSAOMARTE_DADOS.
spring.datasource.url=jdbc:h2:file:${MISSAOMARTE_DADOS:./dados}/missaomarte
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria e ajusta as tabelas. Em producao use migracoes versionadas (Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Segredo do token (minimo 32 bytes). Vazio: gera um aleatorio a cada inicio e os tokens deixam de valer ao reiniciar.
missaomarte.seguranca.segredo=${MISSAOMARTE_JWT_SEGREDO:}
missaomarte.seguranca.validade=2h

# Swagger UI: http://localhost:8080/swagger-ui.html (desligue com springdoc.swagger-ui.enabled=false e springdoc.api-docs.enabled=false).
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
