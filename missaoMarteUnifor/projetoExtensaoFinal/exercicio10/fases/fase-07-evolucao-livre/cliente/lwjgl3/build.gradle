apply plugin: 'application'

dependencies {
    implementation project(':core')

    // Backend desktop: janela, OpenGL e audio (OpenAL) via LWJGL3, mais as bibliotecas nativas.
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'br.edu.unifor.missaomarte.lwjgl3.Lwjgl3Launcher'
}

// Imagens e sons ficam em core/assets (convencao do libGDX) e entram no classpath deste modulo.
sourceSets.main.resources.srcDirs = ['../core/assets']

run {
    // ranking.json e gravado na raiz da fase, nao na pasta do modulo.
    workingDir = rootProject.projectDir

    systemProperty 'missaomarte.semente', System.getProperty('missaomarte.semente', '')

    // Endereco do servidor de ranking: gradlew :lwjgl3:run -Dmissaomarte.servidor=http://localhost:8080
    systemProperty 'missaomarte.servidor', System.getProperty('missaomarte.servidor', 'http://localhost:8080')

    // Em maquinas sem dispositivo de audio: gradlew :lwjgl3:run -Dmissaomarte.semaudio=true
    systemProperty 'missaomarte.semaudio', System.getProperty('missaomarte.semaudio', 'false')

    // Modo toque no desktop (mouse no lugar do dedo, botoes virtuais): gradlew :lwjgl3:run -Dmissaomarte.toque=true
    systemProperty 'missaomarte.toque', System.getProperty('missaomarte.toque', 'false')

    // Tamanho da janela (simula telas de celular): gradlew :lwjgl3:run -Dmissaomarte.toque=true -Dmissaomarte.janela=540x1200
    systemProperty 'missaomarte.janela', System.getProperty('missaomarte.janela', '')

    // O macOS exige que o loop de eventos rode na primeira thread.
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}
