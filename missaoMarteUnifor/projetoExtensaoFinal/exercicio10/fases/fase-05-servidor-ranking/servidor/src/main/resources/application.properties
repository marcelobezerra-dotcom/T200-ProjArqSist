spring.application.name=missao-marte-servidor

# So aceita conexoes da propria maquina. Para abrir para a rede: -Dserver.address=0.0.0.0 (use HTTPS).
server.address=127.0.0.1
server.port=8080

# Banco H2 em arquivo (pasta ./dados). Troque a pasta com a variavel de ambiente MISSAOMARTE_DADOS.
spring.datasource.url=jdbc:h2:file:${MISSAOMARTE_DADOS:./dados}/missaomarte
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria e ajusta as tabelas. Em producao use migracoes versionadas (Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Segredo do token (minimo 32 bytes). Vazio: gera um aleatorio a cada inicio e os tokens deixam de valer ao reiniciar.
missaomarte.seguranca.segredo=${MISSAOMARTE_JWT_SEGREDO:}
missaomarte.seguranca.validade=2h
